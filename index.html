<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="五代十國與北宋中央集權互動小測：逐題完成選擇、填空與配對，最後查看總分。">
  <title>五代十國與北宋中央集權｜互動小測</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand"><h1>五代十國與北宋中央集權</h1><span class="brand-subtitle">互動小測</span></div>
      <span class="header-note">逐題完成・最後查看總分</span>
    </div>
  </header>

  <main class="page-shell">
    <div id="quiz-layout" class="quiz-layout">
      <section class="panel main-panel" aria-label="小測題目與結果">
        <div id="view-quiz">
          <div class="progress-head"><h2 id="question-counter">第 1 題／共 33 題</h2><span id="progress-label">已完成 0／33 題</span></div>
          <div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
          <article aria-live="polite">
            <p id="question-kind" class="question-kind">選擇題</p>
            <h2 id="question-title" class="question-title"></h2>
            <div id="question-body"></div>
          </article>
          <p class="unlock-note">完成本題後即可解鎖下一題。交卷前可返回修改答案。</p>
          <div class="quiz-actions"><button id="prev-question" class="btn" disabled>上一題</button><button id="next-question" class="btn primary" disabled>下一題</button></div>
        </div>

        <div id="view-results" hidden>
          <p class="question-kind">全卷完成</p>
          <h2 class="result-title">小測總分</h2>
          <div class="result-total"><strong id="total-score">0</strong><span>／33 分</span></div>
          <p id="result-message" class="result-message"></p>
          <div class="score-breakdown" aria-label="各題型得分">
            <div><span>選擇題</span><strong id="mcq-score">0／15</strong></div>
            <div><span>填空題</span><strong id="blank-score">0／12</strong></div>
            <div><span>配對題</span><strong id="match-score">0／6</strong></div>
          </div>
          <button id="restart-quiz" class="btn primary restart-btn">重新作答</button>
          <section class="review-section" aria-label="答案與解析">
            <h3>答案與解析</h3>
            <p>展開題目可查看你的答案、正確答案與選擇題解析。</p>
            <div id="review-list" class="review-list"></div>
          </section>
        </div>
      </section>

      <aside id="side-panel" class="panel side-panel" aria-label="作答進度">
        <h3>作答進度</h3>
        <div id="score-ring" class="score-ring"><div class="ring-copy"><strong id="answered-count">0</strong><span>／33 已完成</span></div></div>
        <p class="overview-note">淺金色題號已完成；灰色題號尚未解鎖。</p>
        <div id="question-grid" class="question-grid" aria-label="題目一覽"></div>
        <ul class="section-list"><li>選擇題 <span>1–15</span></li><li>填空題 <span>16–27</span></li><li>配對題 <span>28–33</span></li></ul>
      </aside>
    </div>
    <p class="footer-note">「以史為鑑，可以知興替。」——《資治通鑑》</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
